<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SKU Link Finder</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #2A7B9B;
background: linear-gradient(90deg, rgba(42, 123, 155, 1) 0%, rgba(117, 199, 87, 1) 50%, rgba(237, 129, 83, 1) 99%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(0, 0, 0, 0.308);
            border-radius: 28px;
            box-shadow: 0px 1px 100px rgba(124, 124, 124, 0.12), 0 8px 24px rgba(114, 114, 114, 0.05);
            padding: 50px 45px;
            max-width: 700px;
            width: 100%;
            transition: all 0.3s ease;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            color: #45c3c7;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .subtitle {
            color: #000000;
            font-size: 16px;
            margin-bottom: 35px;
            border-left: 4px solid #2b7a9c;
            padding-left: 16px;
            background: #f0f6fa;
            border-radius: 0 10px 10px 0;
            padding: 12px 18px;
        }

        /* ===== SEARCH AREA ===== */
        .search-box {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .search-box input {
            flex: 1;
            min-width: 200px;
            padding: 16px 22px;
            border: 2px solid #dde7ed;
            border-radius: 16px;
            font-size: 17px;
            outline: none;
            transition: 0.25s ease;
            background: #fafcfe;
        }

        .search-box input:focus {
            border-color: #1f7a9e;
            box-shadow: 0 0 0 4px rgba(31, 122, 158, 0.15);
            background: white;
        }

        .search-box input::placeholder {
            color: #a0b8c8;
        }

        .search-box button {
            padding: 16px 36px;
            background: #1f7a9e;
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .search-box button:hover {
            background: #146180;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(31, 122, 158, 0.3);
        }

        .search-box button:active {
            transform: translateY(0px);
        }

        /* ===== RESULT CARD ===== */
        .result-card {
            background: #f8fbfd;
            border-radius: 18px;
            padding: 24px 26px;
            border: 1px solid #dde7ed;
            display: none;
            animation: fadeSlide 0.3s ease;
        }

        .result-card.visible {
            display: block;
        }

        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-label {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #5a7a8a;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .result-link-wrapper {
            display: flex;
            align-items: center;
            gap: 14px;
            background: white;
            padding: 12px 18px;
            border-radius: 14px;
            border: 1px solid #dde7ed;
            word-break: break-all;
        }

        .result-link-wrapper a {
            color: #1f7a9e;
            text-decoration: none;
            font-size: 15px;
            flex: 1;
            min-width: 0;
        }

        .result-link-wrapper a:hover {
            text-decoration: underline;
        }

        .copy-btn {
            background: #e6eef4;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            color: #1f5a74;
            cursor: pointer;
            transition: 0.2s ease;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .copy-btn:hover {
            background: #d0dfe9;
            transform: scale(1.02);
        }

        .copy-btn:active {
            transform: scale(0.98);
        }

        .copy-btn.copied {
            background: #1f7a9e;
            color: white;
        }

        /* ===== NOT FOUND ===== */
        .not-found {
            color: #b34141;
            background: #ffe9e9;
            padding: 16px 22px;
            border-radius: 14px;
            display: none;
            font-weight: 500;
            font-size: 15px;
        }

        .not-found.visible {
            display: block;
            animation: fadeSlide 0.3s ease;
        }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: 30px;
            text-align: center;
            color: #8aa3b2;
            font-size: 13px;
            border-top: 1px solid #eef4f8;
            padding-top: 20px;
        }

        .footer span {
            background: #eef4f8;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 520px) {
            .container {
                padding: 28px 18px;
            }
            h1 {
                font-size: 24px;
            }
            .search-box button {
                width: 100%;
                justify-content: center;
            }
            .result-link-wrapper {
                flex-wrap: wrap;
            }
            .copy-btn {
                width: 100%;
                justify-content: center;
            }
            .subtitle {
                font-size: 14px;
                padding: 10px 14px;
            }
            .search-box input {
                font-size: 15px;
                padding: 14px 18px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔗 SKU Link Finder</h1>
        <div class="subtitle">
            Enter a SKU to get its product link &amp; copy it instantly.
        </div>

        <!-- ===== SEARCH ===== -->
        <div class="search-box">
            <input type="text" id="skuInput" placeholder="Enter SKU (e.g. KIT001)" spellcheck="false" autofocus />
            <button id="searchBtn">🔍 Find Link</button>
        </div>

        <!-- ===== RESULT ===== -->
        <div id="resultCard" class="result-card">
            <div class="result-label">📌 Product Link</div>
            <div class="result-link-wrapper">
                <a id="resultLink" href="#" target="_blank">—</a>
                <button id="copyBtn" class="copy-btn">📋 Copy</button>
            </div>
        </div>

        <!-- ===== NOT FOUND ===== -->
        <div id="notFound" class="not-found">
            ❌ No link found for that SKU.
        </div>

        <div class="footer">
            <span id="skuCount">📦 0 SKUs available</span>
        </div>
    </div>

    <script>
        // ================================================================
        //   ⭐ MASTER DATA — EDIT THIS SECTION TO ADD YOUR SKUs ⭐
        // ================================================================
        // This is where you add all your SKUs and their product links.
        // Format: 'SKU-CODE': 'https://product-link.com'
        // ================================================================

        const MASTER_SKU_DATA = {
            // ---------- AMAZON PRODUCTS ----------
            'KIT001': 'https://amzn.to/4wxi3Rp',
            'KIT002': 'https://amzn.to/4pTqaoS',
            'KIT003': '',
            'KIT004': '',
            'KIT005': '',
            'KIT006': '',
            'KIT007': '',
            'KIT008': '',
            'KIT009': '',
            'KIT010': '',
            'KIT011': '',
            'KIT012': '',
            'KIT013': '',
            'KIT014': '',
            'KIT015': '',
            'KIT016': '',
           




            

            // ============================================================
            //  ⬇️  ADD YOUR SKUs BELOW THIS LINE  ⬇️
            // ============================================================
            // 'YOUR-SKU-HERE': 'https://your-product-link.com',
            // 'PHONE-12': 'https://www.amazon.com/dp/B0ABCDEFGH',
            // 'LAPTOP-99': 'https://www.bestbuy.com/product/12345',
        };

        // ================================================================
        //   CONFIG - NO NEED TO EDIT BELOW THIS LINE
        // ================================================================

        const STORAGE_KEY = 'skuLinks_userData';

        // ================================================================
        //   DATA LAYER
        // ================================================================

        // Get master data (read-only)
        function getMasterData() {
            return { ...MASTER_SKU_DATA };
        }

        // Get user data from localStorage (for future use)
        function getUserData() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    return JSON.parse(stored);
                } catch {
                    return {};
                }
            }
            return {};
        }

        // Get combined data (master + user) — user overrides master if same SKU
        function getCombinedData() {
            const master = getMasterData();
            const user = getUserData();
            return { ...master, ...user };
        }

        // ================================================================
        //   DOM REFS
        // ================================================================

        const skuInput = document.getElementById('skuInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultCard = document.getElementById('resultCard');
        const resultLink = document.getElementById('resultLink');
        const copyBtn = document.getElementById('copyBtn');
        const notFound = document.getElementById('notFound');
        const skuCount = document.getElementById('skuCount');

        // ================================================================
        //   UPDATE SKU COUNT
        // ================================================================

        function updateSkuCount() {
            const data = getCombinedData();
            const count = Object.keys(data).length;
            skuCount.textContent = `📦 ${count} SKUs available`;
        }

        // ================================================================
        //   SEARCH LOGIC
        // ================================================================

        function lookupSku(sku) {
            const trimmed = sku.trim();
            if (!trimmed) {
                resultCard.classList.remove('visible');
                notFound.classList.remove('visible');
                return;
            }

            const data = getCombinedData();
            const link = data[trimmed];

            if (link) {
                resultLink.href = link;
                resultLink.textContent = link;
                resultCard.classList.add('visible');
                notFound.classList.remove('visible');
                copyBtn.textContent = '📋 Copy';
                copyBtn.classList.remove('copied');
            } else {
                resultCard.classList.remove('visible');
                notFound.classList.add('visible');
            }
        }

        // ================================================================
        //   COPY LINK
        // ================================================================

        async function copyLink() {
            const link = resultLink.textContent;
            if (!link || link === '—') return;

            try {
                await navigator.clipboard.writeText(link);
                copyBtn.textContent = '✅ Copied!';
                copyBtn.classList.add('copied');
                setTimeout(() => {
                    copyBtn.textContent = '📋 Copy';
                    copyBtn.classList.remove('copied');
                }, 2000);
            } catch {
                // Fallback for older browsers
                const temp = document.createElement('input');
                temp.value = link;
                document.body.appendChild(temp);
                temp.select();
                document.execCommand('copy');
                temp.remove();
                copyBtn.textContent = '✅ Copied!';
                copyBtn.classList.add('copied');
                setTimeout(() => {
                    copyBtn.textContent = '📋 Copy';
                    copyBtn.classList.remove('copied');
                }, 2000);
            }
        }

        // ================================================================
        //   EVENT BINDINGS
        // ================================================================

        searchBtn.addEventListener('click', () => lookupSku(skuInput.value));

        skuInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                lookupSku(skuInput.value);
            }
        });

        copyBtn.addEventListener('click', copyLink);

        // ================================================================
        //   KEYBOARD SHORTCUTS
        // ================================================================

        // Ctrl+K or Cmd+K to focus search
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                skuInput.focus();
                skuInput.select();
            }
            // Escape to clear search and results
            if (e.key === 'Escape') {
                skuInput.value = '';
                resultCard.classList.remove('visible');
                notFound.classList.remove('visible');
                skuInput.focus();
            }
        });

        // ================================================================
        //   INIT
        // ================================================================

        updateSkuCount();

        // Auto-search from URL param (e.g. ?sku=AMZ-442)
        const urlParams = new URLSearchParams(window.location.search);
        const skuParam = urlParams.get('sku');
        if (skuParam) {
            skuInput.value = skuParam;
            lookupSku(skuParam);
        }

        console.log('🔗 SKU Link Finder ready!');
        console.log(`📦 ${Object.keys(getCombinedData()).length} SKUs loaded`);
        console.log('⭐ To add SKUs, edit MASTER_SKU_DATA in the JavaScript');
        console.log('⌨️  Shortcuts: Ctrl+K to search, Escape to clear');
    </script>

</body>
</html>
